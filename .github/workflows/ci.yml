name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / Node.js 22
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      # Windows exposes its default user temp directory through an 8.3 alias
      # (RUNNER~1). Atlas deliberately distinguishes canonical paths from
      # paths traversing aliases/reparse points, so keep test fixtures in the
      # runner's canonical, job-scoped temporary directory on every platform.
      TMPDIR: ${{ runner.temp }}
      TEMP: ${{ runner.temp }}
      TMP: ${{ runner.temp }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Build, test, and verify public contents
        run: npm run check
